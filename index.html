<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: #bcd3f2;
        font-family: Arial;
      }

      header {
        text-align: center;
        font-size: 2rem;
        font-weight: bold;
        padding: 20px;
      }

      form {
        max-width: 500px;
        margin: auto;
        padding: 20px;
      }

      label {
        font-weight: bold;
        font-size: 18px;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
      }

      button {
        width: 100%;
        padding: 10px;
        font-size: 18px;
        background: linear-gradient(#635ce6, #090979, #00d4ff);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }

      button:hover {
        transform: scale(1.05);
      }

      .card {
        max-width: 500px;
        margin: 20px auto;
        padding: 20px;
        border: 2px solid black;
        border-radius: 10px;
        background: white;
      }

      .card p {
        background: white;
        margin: 8px 0;
      }

      @media (max-width: 768px) {
        form {
          width: 90%;
        }
        header {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>Registration Form</header>

    <form id="registerForm">
      <label>Username</label>
      <input type="text" id="name" required pattern="[A-Za-z ]{3,}" />

      <br /><br />

      <label>Email</label>
      <input type="email" id="email" required />

      <br /><br />

      <label>Password</label>
      <input
        type="password"
        id="password"
        required
        pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}"
        title="Minimum 6 characters, 1 uppercase and 1 number"
      />

      <br /><br />

      <label>Date of Birth</label>
      <input type="date" id="dob" required />

      <br /><br />

      <label>Gender</label><br />

      <input
        type="radio"
        name="gender"
        value="Male"
        required
        style="width: auto"
      />
      Male
      <input type="radio" name="gender" value="Female" style="width: auto" />
      Female

      <br /><br />

      <label>Category</label>

      <select id="category" required>
        <option value="">Select</option>
        <option>Kid</option>
        <option>Adult</option>
      </select>

      <br /><br />

      <label>Profile Picture</label>
      <input type="file" id="file" accept="image/*" required />
      <br /><br />

      <label>
        <input type="checkbox" id="terms" style="width: auto" required />
        Accept Terms & Conditions
      </label>

      <br /><br />

      <button type="submit">Register</button>
    </form>

    <div id="card"></div>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", (e) => {
          e.preventDefault();

          let username = document.getElementById("name").value;
          let email = document.getElementById("email").value;
          let password = document.getElementById("password").value;
          let dob = document.getElementById("dob").value;
          let category = document.getElementById("category").value;
          let file = document.getElementById("file").files[0];
          let imageURL = URL.createObjectURL(file);

          let gender = document.querySelector(
            'input[name="gender"]:checked',
          ).value;

          localStorage.setItem("username", username);
          localStorage.setItem("email", email);
          localStorage.setItem("password", password);
          localStorage.setItem("dob", dob);
          localStorage.setItem("category", category);
          localStorage.setItem("gender", gender);

          const showData = () => {
            document.getElementById("card").innerHTML = `
<div class="card">
<h2 style="background:white;">Registered Details</h2>
<p><b>Username:</b> ${username}</p>
<p><b>Email:</b> ${email}</p>
<p><b>Password:</b> ${password}</p>
<p><b>DOB:</b> ${dob}</p>
<p><b>Gender:</b> ${gender}</p>
<p><b>Category:</b> ${category}</p>
<p><b>Profile Picture:</b></p>
<img src="${imageURL}" width="120" height="120"
style="border-radius:50%; border:2px solid black; object-fit:cover;">
</div>
`;
          };

          showData();

          setTimeout(() => {
            window.location = "Login.html";
          }, 2000);
        });
    </script>
  </body>
</html>
