<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <style>
    * {
      background: #bcd3f2;
    }
    button:hover {
      transform: scale(1.1);
    }
  </style>
  <body>
    <header
      style="
        text-align: center;
        color: black;
        font-weight: bold;
        font-size: 2rem;
        width: 100%;
        height: 100px;
      "
    >
      Registration Form
    </header>
    <form
      action="Login.html"
      style="width: 100%; height: 100vh; align-items: center; gap: 1rem"
    >
      <label style="font-weight: bold; font-size: 1.2rem" for="name"
        >Username:
      </label>
      <input type="text" id="name" placeholder="Name" /> <br />
      <br />
      <label style="font-weight: bold; font-size: 1.2rem" for="email"
        >Email:
      </label>
      <input type="email" id="email" placeholder="Email" /> <br />
      <br />
      <label style="font-weight: bold; font-size: 1.2rem" for="password"
        >Password:
      </label>
      <input type="password" id="password" placeholder="Password" /> <br />
      <br />
      <button
        style="
          background: linear-gradient(#635ce6, #090979, #00d4ff);
          color: white;
          border: none;
          padding: 10px 20px;
          font-size: 1.2rem;
          border-radius: 5px;
          cursor: pointer;
        "
        type="submit"
      >
        Register
      </button>
    </form>
  </body>
</html>
