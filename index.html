<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <style>
      * {
        background: #bcd3f2;
      }

      button:hover {
        transform: scale(1.1);
      }
      form {
        max-width: 500px;
        margin: auto;
        padding: 20px;
      }

      input {
        width: 100%;
        padding: 10px;
      }

      button {
        width: 100%;
        background: linear-gradient(#635ce6, #090979, #00d4ff);
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 1.2rem;
        border-radius: 5px;
        cursor: pointer;
      }
      @media (max-width: 768px) {
        header {
          font-size: 1.5rem !important;
        }

        form {
          width: 90%;
        }
      }
    </style>
  </head>

  <body>
    <header
      style="
        text-align: center;
        color: black;
        font-weight: bold;
        font-size: 2rem;
        width: 100%;
        height: 100px;
      "
    >
      Registration Form
    </header>

    <form id="registerForm" action="Login.html">
      <label style="font-weight: bold; font-size: 1.2rem" for="name">
        Username:
      </label>

      <input type="text" id="name" placeholder="Name" required />
      <br /><br />

      <label style="font-weight: bold; font-size: 1.2rem" for="email">
        Email:
      </label>

      <input type="email" id="email" placeholder="Email" required />
      <br /><br />

      <label style="font-weight: bold; font-size: 1.2rem" for="password">
        Password:
      </label>

      <input type="password" id="password" placeholder="Password" required />
      <br /><br />

      <button type="submit">Register</button>
    </form>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", function () {
          let username = document.getElementById("name").value;
          let email = document.getElementById("email").value;

          localStorage.setItem("username", username);
          localStorage.setItem("email", email);
        });
    </script>
  </body>
</html>
