<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      * {
        background: #bcd3f2;
      }

      button:hover {
        transform: scale(1.1);
      }
    </style>
  </head>

  <body>
    <header
      style="
        text-align: center;
        color: black;
        font-size: 2rem;
        width: 100%;
        height: 100px;
        font-weight: bold;
      "
    >
      Login Form
    </header>

    <form
      action="Homepage.html"
      style="width: 100%; height: 100vh; align-items: center; gap: 1rem"
    >
      <label style="font-weight: bold; font-size: 1.2rem" for="name">
        Username:
      </label>

      <input type="text" id="name" placeholder="Name" required />
      <br /><br />

      <label style="font-weight: bold; font-size: 1.2rem" for="password">
        Password:
      </label>

      <input type="password" id="password" placeholder="Password" required />
      <br /><br />

      <button
        style="
          background: linear-gradient(#635ce6, #090979, #00d4ff);
          color: white;
          border: none;
          padding: 10px 20px;
          font-size: 1.2rem;
          border-radius: 5px;
          cursor: pointer;
        "
        type="submit"
      >
        Login
      </button>

      <br /><br />

      <a href="index.html">
        <button
          type="button"
          style="
            background: linear-gradient(#28a745, #218838);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
          "
        >
          Register Here
        </button>
      </a>
    </form>

    <script>
      window.onload = function () {
        let username = localStorage.getItem("username");

        if (username) {
          document.getElementById("name").value = username;
        }
      };
    </script>
  </body>
</html>
